{% load humanize %}
<li data-event-row class="flex items-center gap-3 py-3{% if event.completed %} opacity-50{% endif %}">
  <input type="checkbox" class="event-check h-5 w-5 shrink-0 cursor-pointer accent-indigo-600"
         data-url="{% url 'toggle_event' event.pk %}" aria-label="Mark {{ event.title }} done"
         {% if event.completed %}checked{% endif %}>
  <span class="h-10 w-1 shrink-0 rounded-full" style="background-color: {{ event.course.color }};"></span>
  <div class="min-w-0 flex-1">
    <a href="{% url 'event_detail' event.pk %}" data-title
       class="block truncate font-medium text-slate-900 hover:text-indigo-700 hover:underline{% if event.completed %} line-through{% endif %}">{{ event.title }}</a>
    <div class="mt-0.5 flex items-center gap-2 text-xs">
      <span class="font-semibold" style="color: {{ event.course.color }};">{{ event.course.code }}</span>
      {% if event.is_custom %}<span class="rounded bg-slate-100 px-1.5 py-0.5 text-slate-500">My task</span>{% endif %}
      {% if event.notes %}<span class="rounded bg-amber-50 px-1.5 py-0.5 text-amber-700">Has notes</span>{% endif %}
    </div>
  </div>
  <div class="shrink-0 text-right text-sm{% if event.is_overdue %} font-medium text-red-600{% else %} text-slate-600{% endif %}">
    {{ event.due_at|naturalday:"D, M j"|capfirst }}
    {% if not event.all_day %}<div class="text-xs{% if event.is_overdue %} text-red-500{% else %} text-slate-400{% endif %}">{{ event.due_at|time:"g:i A" }}</div>{% endif %}
  </div>
</li>
