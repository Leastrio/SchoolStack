{% load humanize %}
<li data-event-row class="flex items-start justify-between gap-3 border-l-4 py-3 pl-3 pr-3{% if event.completed %} line-through opacity-50{% endif %}"
    style="border-left-color: {{ event.course.color }}; background-color: {{ event.course.color }}15;">
  <div class="min-w-0">
    <a href="{% url 'event_detail' event.pk %}" class="font-medium hover:underline">{{ event.title }}</a>
    <div class="flex flex-wrap items-center gap-2 text-xs font-semibold uppercase" style="color: {{ event.course.color }};">
      <span>{{ event.course.code }}</span>
      {% if event.is_custom %}<span class="rounded border px-1 font-normal normal-case">My task</span>{% endif %}
      {% if event.notes %}<span class="rounded border px-1 font-normal normal-case">Has notes</span>{% endif %}
    </div>
  </div>
  <div class="flex shrink-0 items-start gap-2 text-right text-sm {% if event.is_overdue %}text-red-600{% else %}text-gray-600{% endif %}">
    <span>{{ event.due_at|naturalday:"D, M j"|capfirst }}{% if not event.all_day %} · {{ event.due_at|time:"g:i A" }}{% endif %}</span>
    <input type="checkbox" class="event-check mt-1" data-url="{% url 'toggle_event' event.pk %}"
           aria-label="Mark {{ event.title }} done" {% if event.completed %}checked{% endif %}>
  </div>
</li>
